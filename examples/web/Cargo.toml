[package]
name = "map-editor-web"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
dioxus = { workspace = true, features = ["web", "launch"] }
map-editor-demo = { path = "../demo" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "EventTarget", "Event"] }
