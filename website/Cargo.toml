[package]
name = "map-editor-website"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
dioxus = { workspace = true, features = ["web", "launch", "document", "asset"] }
dioxus-map-editor = { path = "..", features = ["official-plugins"] }
map-editor-demo = { path = "../examples/demo" }

web-sys = { version = "0.3", features = ["Window", "Document", "Element", "EventTarget", "Event", "Location"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
